services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=LiveCommentsCluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  app1:
    build: .
    container_name: app1
    environment:
      - CASSANDRA_HOST=cassandra
      - REDIS_HOST=redis
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_started
  
  app2:
    build: .
    container_name: app2
    environment:
      - CASSANDRA_HOST=cassandra
      - REDIS_HOST=redis
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_started

  app3:
    build: .
    container_name: app3
    environment:
      - CASSANDRA_HOST=cassandra
      - REDIS_HOST=redis
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  cassandra_data: