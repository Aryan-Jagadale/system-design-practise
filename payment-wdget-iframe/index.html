<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Store - CSP Safe Demo</title>
  <script src="https://d113uktkms0lt5.cloudfront.net/widget.min.js" async></script>
</head>
<body style="font-family: system-ui; padding: 40px; text-align: center;">

  <h1>Awesome Product</h1>
  <p style="font-size: 32px; color: green; font-weight: bold;">₹2,999</p>

  <pay-checkout 
    public-key="pk_test_demo123"
    amount="2999"
    currency="INR"
    product-name="Awesome Product"
    order-id="ord_12345"
    primary-color="#4f46e5"
    on-success="handleSuccess"
    on-error="handleError">
  </pay-checkout>


  <script>
    function handlePaymentSuccess(data) {
      alert("Payment Successful!\nPayment ID: " + data.paymentId);
      console.log("Success:", data);
    }

    function handlePaymentError(err) {
      alert("Payment Failed: " + err.message);
    }
  </script>
</body>
</html>
